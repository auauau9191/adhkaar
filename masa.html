/* ============================================================== tokens
   Rishtan porcelain + Samarkand lapis + ishkor turquoise + kundal gold. */
:root{
  --bg:#EEF2F2; --bg-2:#E3E9EA; --card:#FFFFFF; --ink:#16223A; --ink-2:#3B4860; --muted:#66717F;
  --lapis:#1E3F78; --lapis-2:#2F5BA0; --teal:#0F7C7B; --gold:#B88A35; --gold-hi:#D9A944;
  --gold-wash:rgba(217,169,68,.20); --line:rgba(30,63,120,.12); --line-2:rgba(30,63,120,.07);
  --shadow:0 1px 1px rgba(22,34,58,.04),0 10px 30px -18px rgba(22,34,58,.35);
  --dock:rgba(255,255,255,.86); --btn:#1E3F78; --seg-on:#FFFFFF; --now-ink:#0B6B6A;
  --ar:"Amiri","Scheherazade New","Geeza Pro","Noto Naskh Arabic",serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --arscale:1; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --dock-h:calc(124px + var(--sab));
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#0A1120; --bg-2:#0F1829; --card:#111B2E; --ink:#E8EDF5; --ink-2:#C2CCDA; --muted:#8E9BAD;
  --lapis:#93B4EA; --lapis-2:#B4CCF2; --teal:#4CC3BF; --gold:#E3BE6A; --gold-hi:#F0CF83;
  --gold-wash:rgba(227,190,106,.17); --line:rgba(147,180,234,.14); --line-2:rgba(147,180,234,.08);
  --shadow:0 12px 30px -20px rgba(0,0,0,.85); --dock:rgba(14,22,38,.86); --btn:#2C559C; --seg-on:#22355A; --now-ink:#F2D287}}
:root[data-theme="dark"]{
  --bg:#0A1120; --bg-2:#0F1829; --card:#111B2E; --ink:#E8EDF5; --ink-2:#C2CCDA; --muted:#8E9BAD;
  --lapis:#93B4EA; --lapis-2:#B4CCF2; --teal:#4CC3BF; --gold:#E3BE6A; --gold-hi:#F0CF83;
  --gold-wash:rgba(227,190,106,.17); --line:rgba(147,180,234,.14); --line-2:rgba(147,180,234,.08);
  --shadow:0 12px 30px -20px rgba(0,0,0,.85); --dock:rgba(14,22,38,.86); --btn:#2C559C; --seg-on:#22355A; --now-ink:#F2D287}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.62 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:calc(var(--dock-h) + 12px);
  -webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss03"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--lapis-2)}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:8px}
p{margin:0 0 .65em}p:last-child{margin-bottom:0}
.wrap{width:min(100% - 28px,42rem);margin-inline:auto}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================== top bar */
.bar{position:sticky;top:0;z-index:40;padding-top:var(--sat);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(16px);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line-2)}
.bar-in{display:flex;align-items:center;gap:8px;height:56px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none;color:inherit}
.brand img{width:30px;height:30px;border-radius:8px;flex:none}
.brand b{font:600 1.02rem/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brandShort{display:none}
@media (max-width:440px){#brandName{display:none}#brandShort{display:block}}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--bg-2);gap:2px}
.seg button{min-width:38px;height:30px;padding:0 9px;border-radius:9px;font:600 .8rem/1 var(--sans);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(22,34,58,.15)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.iconbtn:active{background:var(--bg-2)}

/* ============================================================== hero (sky) */
.hero{position:relative;isolation:isolate;overflow:hidden;color:#FBF4E4;padding:30px 0 26px}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--sky)}
.hero::after{content:"";position:absolute;inset:auto 0 -40% 0;height:90%;z-index:-1;background:var(--sky-glow)}
[data-page="sabah"]{--sky:linear-gradient(176deg,#13244A 0%,#24427A 38%,#6A5A8A 68%,#C98A73 88%,#EDB27E 100%);
  --sky-glow:radial-gradient(60% 55% at 50% 100%,rgba(255,226,170,.85),rgba(255,214,150,0) 70%)}
[data-page="masa"]{--sky:linear-gradient(176deg,#060B1A 0%,#141A3E 34%,#382A57 62%,#7B4762 84%,#C27756 100%);
  --sky-glow:radial-gradient(60% 50% at 50% 100%,rgba(240,160,115,.55),rgba(240,160,115,0) 70%)}
.hero .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#FBF4E4;opacity:.75}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
.hero .ar-t{font:400 1.5rem/1.2 var(--ar);direction:rtl;text-align:left;opacity:.9;margin-bottom:6px}
.hero h1{margin:0;font:600 clamp(2rem,9vw,2.9rem)/1.02 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.hero .lead{margin:12px 0 0;font-size:.95rem;line-height:1.55;color:#F3E6CF;max-width:30rem;text-wrap:pretty}
.when{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:.82rem;color:#FCE7C0;
  padding:6px 12px;border-radius:999px;background:rgba(10,16,32,.38);border:1px solid rgba(255,232,190,.22)}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .tr{stroke:rgba(255,240,210,.22)}
.ring .pr{stroke:#F0CF83;stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease,ease)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .v b{font:600 1.35rem/1 var(--serif)}
.ring .v span{display:block;font-size:.68rem;color:#F3E6CF;margin-top:3px}
.switch-hint{display:none;margin-top:12px;font-size:.85rem}
.switch-hint.on{display:block}
.switch-hint a{color:#FFE2A6;font-weight:600}

/* ============================================================== rail */
.rail{position:sticky;top:calc(56px + var(--sat));z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
.rail-in{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail-in::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:36px;height:34px;padding:0 6px;border-radius:10px;display:grid;place-items:center;
  font:600 .82rem/1 var(--sans);color:var(--muted);background:var(--card);border:1px solid var(--line);
  scroll-snap-align:center;font-variant-numeric:tabular-nums;position:relative}
.chip.done{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 9%,var(--card))}
.chip.live{color:#fff;background:var(--btn);border-color:var(--btn)}
.chip.noaudio::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.5}

/* ============================================================== cards */
.list{display:grid;gap:16px;padding:18px 0 8px}
.card{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line-2);
  scroll-margin-top:calc(116px + var(--sat));transition:box-shadow .35s,border-color .35s}
.card.live{border-color:color-mix(in srgb,var(--gold) 55%,transparent);
  box-shadow:0 0 0 3px var(--gold-wash),var(--shadow)}
.card.done .num{background:var(--teal);color:#fff;border-color:var(--teal)}
.head{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 4px}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  font:600 .82rem/1 var(--sans);color:var(--gold);font-variant-numeric:tabular-nums;margin-top:1px}
.head h2{flex:1;margin:0;font:600 1.08rem/1.3 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.times{flex:none;font:600 .74rem/1 var(--sans);color:var(--teal);padding:6px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--teal) 10%,transparent);margin-top:2px;white-space:nowrap}
.live-tag{display:none;align-items:center;gap:6px;margin:6px 18px 0;font:600 .76rem/1 var(--sans);color:var(--gold)}
.card.live .live-tag{display:flex}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:2.5px;background:currentColor;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
body.paused .eq i{animation-play-state:paused}

/* Arabic — the memorable thing: gold illumination sweeping through each word */
.ar{direction:rtl;text-align:right;font:400 calc(clamp(1.65rem,6.4vw,2.1rem)*var(--arscale))/2.15 var(--ar);
  padding:12px 18px 14px;color:var(--ink);word-spacing:.04em}
.ar p{margin:0 0 .35em}.ar p:last-child{margin:0}
.ar .bism{font-size:.8em;color:var(--ink-2)}
/* Highlight never paints over the glyphs: the active word changes colour, and a gold bar beneath it
   grows right-to-left as the word is recited. Harakat, shadda and tall letters stay fully visible. */
.w{position:relative;cursor:pointer;transition:opacity .3s ease,color .2s ease}
.card.live .w{opacity:.5}
.card.live .w.past{opacity:1}
.card.live .w.now{opacity:1;color:var(--now-ink)}
.card.live .w.now::after{content:"";position:absolute;right:0;bottom:-.3em;height:.08em;min-height:3px;border-radius:3px;
  width:calc(var(--p,0) * 100%);background:linear-gradient(to left,var(--gold-hi),var(--gold));pointer-events:none}
body.nohl .card.live .w{opacity:1}
body.nohl .card.live .w.now{color:inherit}body.nohl .card.live .w.now::after{display:none}

.tl{padding:12px 18px;border-top:1px solid var(--line-2);font:italic 400 1.08rem/1.75 var(--serif);color:var(--lapis-2)}
.mn{padding:12px 18px 16px;border-top:1px solid var(--line-2);font-size:1rem;line-height:1.66;color:var(--ink-2)}
.saw{font-family:var(--ar);font-size:1.75em;line-height:0;vertical-align:-.2em;color:var(--gold);margin:0 .08em;font-style:normal;font-weight:400}
.mn .src{display:block;margin-top:8px;font-size:.8rem;color:var(--muted)}
body.no-tl .tl,body.no-mn .mn{display:none}

/* counter row */
.act{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-top:1px solid var(--line-2);
  background:var(--card);background:color-mix(in srgb,var(--bg) 55%,var(--card));border-radius:0 0 20px 20px}
.tap{flex:none;min-width:104px;height:48px;padding:0 18px;border-radius:14px;background:var(--btn);color:#fff;
  font:650 1rem/1 var(--sans);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 16px -10px var(--btn);transition:transform .08s,background .25s}
.tap:active{transform:scale(.95)}
.tap.full{background:var(--teal);box-shadow:none}
.beads{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.bead{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .15s,transform .15s}
.bead.on{background:var(--gold);transform:scale(1.2)}
.bar100{flex:1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar100 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:9px;transition:width .15s}
.more{display:flex;align-items:center;gap:4px}
.more button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.more button:active{background:var(--bg-2)}
.more button[aria-pressed="true"]{color:var(--gold);background:var(--gold-wash)}
.card.live .more [data-act="play"]{color:var(--gold);background:var(--gold-wash)}

/* disclosure: virtue + explanation */
details{border-top:1px solid var(--line-2)}
.card>details:last-of-type{border-radius:0 0 20px 20px}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;
  font:600 .9rem/1.2 var(--sans);color:var(--lapis-2)}
summary::-webkit-details-marker{display:none}
summary .chev{transition:transform .2s;color:var(--gold);width:16px;height:16px}
details[open] summary .chev{transform:rotate(90deg)}
.inner{padding:0 18px 16px;font-size:.96rem;line-height:1.66;color:var(--ink-2)}
.inner ul{margin:0;padding-left:1.1em}
.inner li{margin:0 0 .55em}.inner li::marker{color:var(--gold)}
.cite{display:block;margin-top:10px;padding-left:10px;border-left:2px solid var(--gold);font-size:.82rem;color:var(--muted)}
.noaudio-note{margin:4px 0 2px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);
  color:var(--muted);font-size:.92rem;text-align:center}
.badge-na{display:inline-block;margin:6px 18px 0;font-size:.76rem;color:var(--muted)}

/* end + footer */
.end{margin-top:6px;padding:26px 20px;text-align:center;border-radius:20px;background:var(--card);border:1px solid var(--line-2)}
.end .ar-sm{font:400 1.5rem/1.6 var(--ar);color:var(--gold)}
.end h3{margin:4px 0 6px;font:600 1.12rem/1.3 var(--serif)}
.end p{color:var(--muted);font-size:.93rem}
.other{display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px 18px;border-radius:20px;text-decoration:none;
  color:#FBF4E4;background:var(--other-sky)}
[data-page="sabah"] .other{--other-sky:linear-gradient(120deg,#0A1024,#2A2450 60%,#6E4260)}
[data-page="masa"] .other{--other-sky:linear-gradient(120deg,#16284F,#3A5590 60%,#B98575)}
.other img{width:46px;height:46px;border-radius:12px}
.other b{display:block;font:600 1.1rem/1.2 var(--serif)}
.other span{font-size:.84rem;opacity:.85}
.foot{padding:26px 2px 8px;color:var(--muted);font-size:.84rem;line-height:1.7}
.foot h4{margin:0 0 6px;font:600 .9rem/1.3 var(--sans);color:var(--ink-2)}
.foot ul{margin:0 0 14px;padding-left:1.1em}
.key{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 16px}
.key dt{font:italic 600 1rem/1.5 var(--serif);color:var(--lapis-2)}
.key dd{margin:0}

/* ============================================================== dock (audio) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 0 var(--sab);
  background:var(--dock);backdrop-filter:saturate(1.5) blur(20px);-webkit-backdrop-filter:saturate(1.5) blur(20px);
  border-top:1px solid var(--line)}
.seek{position:relative;height:22px;margin:0 14px;touch-action:none;cursor:pointer}
.seek .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:var(--line)}
.seek .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));width:0}
.seek .tick{position:absolute;top:7px;width:2px;height:8px;border-radius:2px;background:var(--muted);opacity:.35}
.seek .knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--gold-hi);
  box-shadow:0 1px 4px rgba(0,0,0,.3);left:0}
.dock-in{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:6px;padding:0 12px 8px}
.dock-in .speed{justify-self:start}.dock-in .mode{justify-self:end}
.play{flex:none;width:58px;height:58px;margin:0 8px;border-radius:50%;display:grid;place-items:center;color:#1A1405;
  background:radial-gradient(circle at 35% 30%,#F6DC98,var(--gold-hi) 55%,var(--gold));box-shadow:0 8px 20px -10px var(--gold)}
.play svg{width:24px;height:24px;fill:currentColor;stroke:none}
.play:active{transform:scale(.95)}
.np{display:flex;align-items:baseline;gap:10px;padding:0 18px 2px;min-width:0}
.np .t{flex:1;min-width:0;font:600 .9rem/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .rep{flex:none;font:650 .76rem/1 var(--sans);color:var(--gold);font-variant-numeric:tabular-nums}
.np .tm{flex:none;font:500 .74rem/1 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.skip{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.skip:active{background:var(--bg-2)}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:5px 6px;border-radius:12px;
  font:600 .66rem/1.1 var(--sans);color:var(--muted)}
.mode[aria-pressed="true"]{color:var(--teal);background:color-mix(in srgb,var(--teal) 11%,transparent)}
.speed{min-width:46px;height:34px;border-radius:9px;font:650 .78rem/1 var(--sans);color:var(--ink-2);background:var(--bg-2)}
.pill{position:fixed;left:50%;bottom:calc(var(--dock-h) + 12px);z-index:45;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--btn);color:#fff;white-space:nowrap;
  font:600 .86rem/1 var(--sans);box-shadow:0 10px 26px -12px rgba(0,0,0,.6);transition:opacity .25s,transform .25s}
.pill.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* ============================================================== sheet (settings) */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(5,10,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:88vh;overflow:auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 20px calc(24px + var(--sab));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 14px;font:600 1.2rem/1.2 var(--serif)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line-2)}
.row label,.row .lb{font-size:.96rem}
.row small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:30px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:var(--teal)}.sw input:checked+i::after{transform:translateX(20px)}
.sizer{display:flex;align-items:center;gap:8px}
.sizer button{width:38px;height:34px;border-radius:10px;background:var(--bg-2);font-weight:650}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;
  background:var(--btn);color:#fff;font:600 .9rem/1 var(--sans);flex:none}
.btn.ghost{background:var(--bg-2);color:var(--ink)}
.btn[disabled]{opacity:.6}
.toast{position:fixed;left:50%;top:calc(70px + var(--sat));z-index:90;transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:.88rem;transition:all .25s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.install{display:none;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--gold-wash);color:var(--ink);font-size:.88rem;
  align-items:center;gap:10px}
.install.on{display:flex}
.install p{flex:1;margin:0}
.install button{color:var(--muted)}

@media (min-width:720px){
  body{font-size:17px}
  .dock-in,.seek,.np{max-width:44rem;margin-inline:auto}
  .seek{margin-inline:auto;width:min(100% - 28px,44rem)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}html{scroll-behavior:auto}}
@media print{.bar,.rail,.dock,.pill,.act .more,.hero .when{display:none}.card{break-inside:avoid;box-shadow:none}body{padding:0}}

<script id="data" type="application/json">{"items":[{"n":1,"audio":true,"ar":["أَعُوْذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيْمِ.","بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ.","اَللّٰهُ لَآ إِلٰهَ إِلَّا هُوَ الْحَىُّ الْقَيُّوْمُ ، لَا تَأْخُذُهُۥ سِنَةٌ وَّلَا نَوْمٌ ، لَهُ مَا فِى السَّمٰـوٰتِ وَمَا فِى الْأَرْضِ ، مَنْ ذَا الَّذِىْ يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِۦ ، يَعْلَمُ مَا بَيْنَ أَيْدِيْهِمْ وَمَا خَلْفَهُمْ ، وَلَا يُحِيْطُوْنَ بِشَىْءٍ مِّنْ عِلْمِهِٓ إِلَّا بِمَا شَآءَ ، وَسِعَ كُرْسِيُّهُ السَّمٰـوٰتِ وَالْأَرْضَ ، وَلَا يَئُوْدُهُۥ حِفْظُهُمَا ، وَهُوَ الْعَلِىُّ الْعَظِيْمُ."],"uz":{"t":"Oyatul Kursiy — himoyaning eng kuchlisi","mn":"Quvilgan shaytondan Allohdan panoh soʻrayman.\nMehribon va rahmli Alloh nomi bilan.\n\nAlloh, Undan oʻzga iloh yoʻq. U tirikdir va qayyumdir. Uni mudroq ham, uyqu ham olmas. Osmonlaru yerdagi narsalar Unikidir. Uning huzurida Oʻzining iznisiz hech kim shafoat qila olmas. U ularning oldilaridagi narsani ham, ortlaridagi narsani ham bilur. Uning ilmidan hech narsani ihota qila olmaslar, magar Oʻzi xohlaganini, xolos. Uning kursisi osmonlaru yerni qamragan. U ularni muhofaza qilishdan charchamas. Va U Aliy va Aziym Zotdir. (Baqara, 255)","q":"Tarjima: Shayx Muhammad Sodiq Muhammad Yusuf rohimahulloh.","f":"Ubay ibn Kaʼb roziyallohu anhu xurmosi kamayib borayotganini sezib, bir kecha poyloqchilik qildi va jinni ushladi. Jin: «Sizni bizdan Baqara surasidagi Oyatul Kursiy himoya qiladi. Kim uni ertalab oʻqisa, kechgacha; kechqurun oʻqisa, tonggacha bizdan omonda boʻladi», dedi. Rasululloh ﷺ bu xabarni eshitib: «Yolgʻonchi rost aytibdi», dedilar.","m":"Hokim, «al-Mustadrak», 2064.","s":["«al-Ḥayy» (abadiy Tirik) va «al-Qoyyum» (borliqni tutib turuvchi) — koʻp ulamolar aynan shu ikkisini Allohning Ismi Aʼzami deb bilishgan.","«Uni mudroq ham, uyqu ham olmas» — bu tasalli: siz uxlayotganingizda ham ishlaringizni Tutib turuvchi Zot mudramaydi.","Rasululloh ﷺ: «Oyatul Kursiy oʻqilgan uydan shayton chiqib ketadi», dedilar. Shuning uchun azkorlar shu oyat bilan boshlanadi.","Uni kuniga oʻqish sunnat: har farz namozdan keyin, ertalab, kechqurun va uyquga yotishdan oldin."],"tr":"Aʼuzu billahi minash-shayṭonir-rojim.\nBismillahir-Roḥmanir-Roḥim.\nAllohu la ilaha illa Huwal-Ḥayyul-Qoyyum, la taʼxużuhu sinatun wa la nawm, lahu ma fis-samawati wa ma fil-arḍ, man żallażi yashfaʼu ʼindahu illa bi-iżnih, yaʼlamu ma bayna aydihim wa ma xolfahum, wa la yuḥiṭuna bi-shayʼim-min ʼilmihi illa bima shaʼ, wasiʼa kursiyyuhus-samawati wal-arḍ, wa la yaʼuduhu ḥifẓuhuma, wa Huwal-ʼAliyyul-ʼAẓim."},"ru":{"t":"Аят аль-Курси — сильнейшая защита","tr":"Аʼузу билляхи минаш-шайтонир-роджим.\nБисмилляхир-Рохманир-Рохим.\nАллоху ля иляха илля Хувал-Ḥаййул-Qоййум, ля таʼхуżуху синатун ва ля наум, ляху ма фис-самавати ва ма филь-арḍ, ман żаллаżи яшфаʼу ʼиндаху илля би-иżних, яʼляму ма байна айдихим ва ма хольфахум, ва ля юḥитуна би-шайʼим-мин ʼильмихи илля бима шаʼ, васиʼа курсиййухус-самавати валь-арḍ, ва ля яʼудуху ḥифẓухума, ва Хувал-ʼАлиййул-ʼАẓим.","mn":"Прибегаю к Аллаху от изгнанного шайтана.\nВо имя Аллаха, Милостивого, Милосердного.\n\nАллах — нет божества, кроме Него, Живого, Вседержителя. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания только то, что Он пожелает. Его Престол (Подножие Трона) объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий. (2:255)","q":"Перевод: Эльмир Кулиев.","f":"Убай ибн Каʼб (да будет доволен им Аллах) заметил, что запасы фиников в его сосуде убывают. Однажды ночью он подстерёг вора и поймал джинна. Джинн сказал: «От нас тебя защищает аят аль-Курси из суры «аль-Бакара». Кто прочтёт его утром — будет защищён от нас до вечера, а кто прочтёт вечером — до утра». Пророк ﷺ, услышав это, сказал: «Правду сказал лжец».","m":"аль-Хаким, «аль-Мустадрак», 2064.","s":["«аль-Ḥайй» (Вечно Живой) и «аль-Qоййум» (Поддерживающий бытие) — многие учёные считают именно эти два имени Величайшим именем Аллаха.","«Им не овладевают ни дремота, ни сон» — это утешение: пока вы спите, Тот, Кто управляет вашими делами, не дремлет.","Пророк ﷺ сказал: «Из дома, где читается аят аль-Курси, выходит шайтан». Поэтому азкары начинаются с него.","Его сунна читать несколько раз в день: после каждого обязательного намаза, утром, вечером и перед сном."]}},{"n":3,"audio":true,"ar":["بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ. قُلْ هُوَ اللّٰهُ أَحَدٌ ، اَللّٰهُ الصَّمَدُ ، لَمْ يَلِدْ وَلَمْ يُوْلَدْ ، وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ.","بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ. قُلْ أَعُوْذُ بِرَبِّ الْفَلَقِ ، مِنْ شَرِّ مَا خَلَقَ ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.","بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ. قُلْ أَعُوْذُ بِرَبِّ النَّاسِ ، مَلِكِ النَّاسِ ، إِلٰهِ النَّاسِ ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ، اَلَّذِيْ يُوَسْوِسُ فِيْ صُدُوْرِ النَّاسِ ، مِنَ الْجِنَّةِ وَالنَّاسِ."],"uz":{"t":"Uch Qul — har ishingizga kifoya qiladi","mn":"Mehribon va rahmli Alloh nomi bilan.\nAyt: «U Alloh yagonadir. Alloh — Somaddir. U tugʻmagan va tugʻilmagan. Va Unga hech kim teng boʻlmagan». (Ixlos)\n\nMehribon va rahmli Alloh nomi bilan.\nAyt: «Tong Robbisidan panoh soʻrayman. U yaratgan narsalar yomonligidan. Va kirib kelgan qorongʻu kechaning yomonligidan. Va tugunlarga dam soluvchilar yomonligidan. Va hasad qilgan hasadchining yomonligidan». (Falaq)\n\nMehribon va rahmli Alloh nomi bilan.\nAyt: «Odamlar Robbisidan, odamlar podshohidan, odamlar Ilohidan panoh soʻrayman. Berkinib, koʻrinib turuvchi vasvasachining — odamlar qalblariga vasvasa soladiganning — jinlar va odamlardan boʻlganning yomonligidan». (Nos)","q":"Tarjima: Shayx Muhammad Sodiq Muhammad Yusuf rohimahulloh.","f":"Abdulloh ibn Xubayb roziyallohu anhu aytadi: yomgʻirli, qop-qorongʻi kechada Rasululloh ﷺ menga: «Ixlos va Muavvizatayn (Falaq va Nos) suralarini ertalab va kechqurun uch martadan oʻqi — u senga hamma narsada kifoya qiladi», dedilar.","m":"Termiziy, 3575.","s":["Tartibi bejiz emas: avval Ixlos bilan Allohni tanib madh etamiz, soʻng qolgan ikkisi bilan panoh soʻraymiz. Duoning odobi shu.","Ixlos — Allohning toʻliq taʼrifi. «Aḥad» — yagona, «Ṣomad» — hamma Unga muhtoj, Oʻzi hech kimga muhtoj emas.","Falaq bilan tashqi yomonlikdan (yaratiqlar, tun, sehr, hasad), Nos bilan ichki yomonlikdan — qalbga tashlanadigan vasvasadan panoh soʻraymiz.","Ibnul Qoyyim rohimahulloh: bandaning bu suralar bilan panoh soʻrashga ehtiyoji yeb-ichishga boʻlgan ehtiyojidan kattaroqdir."],"tr":"Bismillahir-Roḥmanir-Roḥim. Qul Huwallohu aḥad. Allohuṣ-Ṣomad. Lam yalid wa lam yulad. Wa lam yakullahu kufuwan aḥad.\n\nBismillahir-Roḥmanir-Roḥim. Qul aʼuzu bi-Robbil-falaq. Min sharri ma xolaq. Wa min sharri gʻosiqin iza waqob. Wa min sharrin-naffaṡati fil-ʼuqod. Wa min sharri ḥasidin iza ḥasad.\n\nBismillahir-Roḥmanir-Roḥim. Qul aʼuzu bi-Robbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-xonnas. Allazi yuwaswisu fi ṣudurin-nas. Minal-jinnati wan-nas."},"ru":{"t":"Три «Куль» — довольно тебе во всём","tr":"Бисмилляхир-Рохманир-Рохим. Qуль Хуваллоху аḥад. Аллохуṣ-Ṣомад. Лям ялид ва лям юляд. Ва лям якуллаху куфуван аḥад.\n\nБисмилляхир-Рохманир-Рохим. Qуль аʼузу би-Роббиль-фаляq. Мин шарри ма холяq. Ва мин шарри ġосиqин иза ваqоб. Ва мин шаррин-наффаṡати филь-ʼуqод. Ва мин шарри ḥасидин иза ḥасад.\n\nБисмилляхир-Рохманир-Рохим. Qуль аʼузу би-Роббин-нас. Маликин-нас. Иляхин-нас. Мин шарриль-васвасиль-хоннас. Аллази ювасвису фи ṣудурин-нас. Миналь-джиннати ван-нас.","mn":"Во имя Аллаха, Милостивого, Милосердного.\nСкажи: «Он — Аллах Единый, Аллах Самодостаточный. Он не родил и не был рождён, и нет никого равного Ему». (Сура «аль-Ихлас»)\n\nВо имя Аллаха, Милостивого, Милосердного.\nСкажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла колдуний, поплёвывающих на узлы, от зла завистника, когда он завидует». (Сура «аль-Фаляк»)\n\nВо имя Аллаха, Милостивого, Милосердного.\nСкажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла искусителя отступающего при поминании Аллаха, который наущает в груди людей, и бывает из джиннов и людей». (Сура «ан-Нас»)","q":"Перевод: Эльмир Кулиев.","f":"Абдуллах ибн Хубайб (да будет доволен им Аллах) рассказывал: в дождливую и очень тёмную ночь мы искали Пророка ﷺ. Он сказал мне: «Читай суру «аль-Ихлас» и «аль-Муʼаввизатайн» (суры «аль-Фаляк» и «ан-Нас») по три раза утром и вечером — этого будет достаточно тебе во всём».","m":"ат-Тирмизи, 3575.","s":["Порядок не случаен: сначала сурой «аль-Ихлас» мы познаём Аллаха и восхваляем Его, затем двумя другими просим защиты. Таков адаб дуа.","«аль-Ихлас» — полное описание Аллаха. «Аḥад» — Единственный, «Ṣомад» — Самодостаточный, в Ком нуждаются все, а Он не нуждается ни в ком.","Сурой «аль-Фаляк» просим защиты от внешнего зла (творения, ночь, колдовство, зависть), а сурой «ан-Нас» — от внутреннего: наущений в сердце.","Ибн аль-Каййим сказал: нужда раба в защите этими сурами больше, чем его нужда в еде и питье."]}},{"n":10,"audio":true,"ar":["لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، يُحْيِيْ وَيُمِيْتُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ."],"uz":{"t":"Tavhid kalimasi — oʻn marta","mn":"Allohdan oʻzga ibodatga loyiq iloh yoʻq. U yakka-yolgʻiz, sherigi yoʻq. Mulk Unikidir, hamd ham Unikidir. U tiriltiradi va oʻldiradi. U har narsaga Qodirdir.","q":"","f":"Rasululloh ﷺ: «Kim kechqurun buni oʻn marta aytsa, unga oʻn yaxshilik yoziladi, oʻn gunohi oʻchiriladi, oʻn daraja koʻtariladi va tong otguncha shaytondan saqlangan boʻladi», dedilar.","m":"Nasoiy, «Amalul-yavm val-layla», 24; Ahmad, 23590.","s":["Oqshomni tavhid kalimasi bilan yakunlash — imonni yangilashdir.","«Yuḥyi wa yumit» — tiriltiradi va oʻldiradi. Uyqu — kichik oʻlim; siz uni Allohning qoʻliga topshirasiz.","«Mulk Unikidir» — kimdandir umid qilsangiz, avval buni eslang: mulk allaqachon Egasi qoʻlida.","Oʻn marta aytish — bir daqiqa vaqt, evaziga oʻn daraja va tun boʻyi himoya."],"tr":"La ilaha illalloh, waḥdahu la sharika lah, lahul-mulku wa lahul-ḥamd, yuḥyi wa yumit, wa Huwa ʼala kulli shayʼin Qodir."},"ru":{"t":"Слово единобожия — десять раз","tr":"Ля иляха илляллоху, ваḥдаху ля шарика лях, ляхуль-мульку ва ляхуль-ḥамд, юḥйи ва юмит, ва Хува ʼаля кулли шайʼин Qодир.","mn":"Нет божества, достойного поклонения, кроме Аллаха, Единственного, у Которого нет сотоварища. Ему принадлежит владычество, Ему хвала. Он оживляет и умерщвляет, и Он над всякой вещью мощен.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это вечером десять раз, тому запишут десять благодеяний, сотрут десять грехов, поднимут на десять степеней, и он будет защищён от шайтана до утра».","m":"ан-Насаи, «Амаль аль-йаум ва-ль-лейля», 24; Ахмад, 23590.","s":["Завершать вечер словом единобожия — значит обновлять веру.","«Юḥйи ва юмит» — оживляет и умерщвляет. Сон — малая смерть; вы вручаете её в руки Аллаха.","«Ему принадлежит владычество» — если сегодня на кого-то надеетесь, сначала вспомните: власть уже в руках её Владельца.","Десять раз — минута времени, а взамен десять степеней и защита на всю ночь."]}},{"n":7,"audio":true,"ar":["حَسْبِيَ اللّٰهُ لَا إِلٰهَ إِلَّا هُوَ ، عَلَيْهِ تَوَكَّلْتُ ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيْمِ."],"uz":{"t":"Alloh menga kifoya — yetti marta","mn":"Menga Alloh kifoya. Undan oʻzga iloh yoʻq. Men faqat Unga tavakkul qildim. U — ulugʻ Arshning Robbidir.","q":"","f":"Rasululloh ﷺ: «Kim ertalab va kechqurun buni yetti marta aytsa, dunyo va oxirat ishlaridan tashvishga solgan narsasiga Alloh kifoya qiladi», dedilar.","m":"Abu Dovud, 5081 (mavquf) va Ibn Sunniy, 71 (marfuʼ).","s":["«Ḥasbiy» — «menga yetadi». Bu — hisob-kitobni Allohga topshirish.","Tavakkul — qoʻl qovushtirib oʻtirish emas; sabab qilib, natijani Allohga topshirishdir.","Duo «ulugʻ Arshning Robbi» bilan tugaydi: eng ulkan maxluqni boshqargan Zot bugungi tashvishingizni yengib qoʻymaydimi?","Oqshom bu kalimani ayting — kun davomida yigʻilgan tashvish yukini Allohga topshirasiz."],"tr":"Ḥasbiyallohu la ilaha illa Hu, ʼalayhi tawakkaltu, wa Huwa Robbul-ʼArshil-ʼAẓim."},"ru":{"t":"Аллах мне достаточен — семь раз","tr":"Ḥасбияллоху ля иляха илля Ху, ʼаляйхи таваккальту, ва Хува Роббуль-ʼАршиль-ʼАẓим.","mn":"Довольно мне Аллаха. Нет божества, кроме Него. На Него я уповаю, и Он — Господь великого Трона.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это утром и вечером семь раз, тому Аллах будет достаточен во всём, что заботит его из дел этого мира и Последней жизни».","m":"Абу Дауд, 5081 (маукуф); Ибн ас-Сунни, 71 (марфуʼ).","s":["«Ḥасбий» — «мне достаточно». Это передача итога дел Аллаху.","Таваккуль — не бездействие; это принятие причин с передачей результата Аллаху.","Дуа завершается словами «Господь великого Трона»: разве Тот, Кто управляет величайшим творением, не одолеет вашу сегодняшнюю заботу?","Скажите это вечером — и передадите Аллаху груз забот, накопившихся за день."]}},{"n":3,"audio":true,"ar":["بِسْمِ اللّٰهِ الَّذِيْ لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ، وَهُوَ السَّمِيْعُ الْعَلِيْمُ."],"uz":{"t":"Alloh nomi bilan — hech narsa zarar yetkaza olmaydi","mn":"Uning nomi bilan yerda ham, osmonda ham hech narsa zarar yetkaza olmaydigan Alloh nomi bilan. U — hamma narsani Eshituvchi, Bilguvchidir.","q":"","f":"Rasululloh ﷺ: «Kim ertalab va kechqurun buni uch marta aytsa, unga hech narsa zarar yetkazmaydi», dedilar.","m":"Abu Dovud, 5088; Termiziy, 3388; Ibn Moja, 3869.","s":["Diqqat qiling: duo «zarar boʻlmaydi» demaydi — «Uning nomi bilan zarar yetkaza olmaydi» deydi. Himoya narsalarda emas, Allohning ismida.","«Yerda ham, osmonda ham» — barcha yoʻnalish qamrab olingan.","«as-Samiʼ» — shivirlaganingizni eshitadi; «al-ʼAlim» — hali kelmagan xavfni ham biladi.","Qisqa va kuchli — kechasi chaqadigan zararlardan ham himoya."],"tr":"Bismillahillazi la yaḍurru maʼasmihi shayʼun fil-arḍi wa la fis-samaʼi, wa Huwas-Samiʼul-ʼAlim."},"ru":{"t":"С именем Аллаха — ничто не навредит","tr":"Бисмилляхиллязи ля яḍурру маʼасмихи шайʼун филь-арḍи ва ля фис-самаʼи, ва Хувас-Самиʼуль-ʼАлим.","mn":"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе. Он — Всеслышащий, Всезнающий.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это утром и вечером три раза, тому ничто не причинит вреда».","m":"Абу Дауд, 5088; ат-Тирмизи, 3388; Ибн Маджа, 3869.","s":["Заметьте: дуа не говорит «вреда не будет» — оно говорит «с Его именем ничто не навредит». Защита не в вещах, а в имени Аллаха.","«Ни на земле, ни на небе» — охвачены все направления.","«ас-Самиʼ» — Он слышит ваш шёпот; «аль-ʼАлим» — Он знает опасность, которая ещё не пришла.","Коротко и сильно — защита и от того, что вредит по ночам."]}},{"n":3,"audio":true,"ar":["أَعُوْذُ بِكَلِمَاتِ اللّٰهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ."],"uz":{"t":"Allohning mukammal kalimalari bilan panoh","mn":"Alloh yaratgan narsalarning yomonligidan Uning mukammal kalimalari bilan panoh soʻrayman.","q":"","f":"Rasululloh ﷺ: «Kim kechqurun buni uch marta aytsa, oʻsha tunda uni chaqqan ilon (zahri) zarar qilmaydi», dedilar.","m":"Muslim, 2709; Termiziy, 3437.","s":["«Tammat» — mukammal, kam-koʻstsiz. Allohning soʻzi hech qachon yolgʻon chiqmaydi.","Allohning kalimalari bilan panoh soʻrash — Uning sifati bilan panoh soʻrash; bu maxluqqa emas, Xoliqqa murojaat.","«Yaratgan narsalari» — istisnosiz hammasi Uning nazorati ostida.","Ayniqsa oqshom — tun yomonliklari yoyiladigan payt; shu duo bilan qalqon oling."],"tr":"Aʼuzu bi-kalimatillahit-tammati min sharri ma xolaq."},"ru":{"t":"Защита совершенными словами Аллаха","tr":"Аʼузу би-калиматилляхит-таммати мин шарри ма холяq.","mn":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это вечером три раза, тому не повредит яд змеи, ужалившей его той ночью».","m":"Муслим, 2709; ат-Тирмизи, 3437.","s":["«Таммат» — совершенные, без изъяна. Слово Аллаха никогда не окажется ложью и никогда не будет слабым.","Прибегать к словам Аллаха — значит прибегать к Его атрибуту; это обращение не к творению, а к Творцу.","«Того, что Он сотворил» — без исключения всё под Его надзором.","Особенно вечером — время, когда распространяется ночное зло; возьмите этот щит."]}},{"n":3,"audio":true,"ar":["رَضِيْتُ بِاللّٰهِ رَبًّا ، وَبِالْإِسْلَامِ دِيْنًا ، وَبِمُحَمَّدٍ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا."],"uz":{"t":"Rozilik kalimasi","mn":"Men Allohning Robb ekaniga, Islomning din ekaniga va Muhammad ﷺ ning paygʻambar ekaniga rozi boʻldim.","q":"","f":"Rasululloh ﷺ: «Kim ertalab va kechqurun buni uch marta aytsa, Qiyomat kuni Alloh uni rozi qilishi haq boʻladi», dedilar.","m":"Abu Dovud, 5072; Termiziy, 3389; Ibn Moja, 3870.","s":["Uch narsani qamrab oladi: Kimga ibodat qilaman? Qaysi yoʻl bilan? Kimga ergashib?","«Rozi boʻldim» — koʻnikish emas, tanlash. Boshqa yoʻllarni koʻrib, ongli ravishda shuni tanladingiz.","Savob ham shu soʻz bilan qaytariladi: siz Undan rozi boʻldingiz — U ham sizdan rozi boʻlishga oʻzini haq qildi.","Rasululloh ﷺ: «Kim buni aytsa, imonning taʼmini tatib koʻrgan boʻladi» (Muslim, 34)."],"tr":"Roḍitu billahi Robban, wa bil-Islami dinan, wa bi-Muḥammadin sollallohu alayhi wa sallama nabiyya."},"ru":{"t":"Слово довольства","tr":"Роḍиту билляхи Роббан, ва биль-Ислями динан, ва би-Муḥаммадин соллаллоху ʼаляйхи ва салляма набийя.","mn":"Я доволен Аллахом как Господом, Исламом как религией и Мухаммадом ﷺ как пророком.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это утром и вечером три раза, того Аллах непременно сделает довольным в День воскресения».","m":"Абу Дауд, 5072; ат-Тирмизи, 3389; Ибн Маджа, 3870.","s":["Оно охватывает три вопроса: Кому поклоняюсь? Каким путём? За кем следуя?","«Я доволен» — не смирение поневоле, а выбор. Вы говорите, что, увидев другие пути, сознательно избрали этот.","Награда возвращается тем же словом: вы стали довольны Им — и Он обязал Себя сделать вас довольными.","Пророк ﷺ сказал: «Кто скажет это, тот вкусит сладость веры» (Муслим, 34)."]}},{"n":4,"audio":true,"ar":["اَللّٰهُمَّ إِنِّيْ أَمْسَيْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَجَمِيْعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللّٰهُ لَا إِلٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُوْلُكَ."],"uz":{"t":"Doʻzaxdan ozod boʻlish — toʻrt marta","mn":"Ey Alloh, men oqshomga Seni guvoh qilib kirdim; Arshingni koʻtaruvchi farishtalarni, barcha farishtalaringni va butun xalqingni guvoh qilaman: Sen — Allohsan, Sendan oʻzga iloh yoʻq, Sen yakka-yolgʻizsan, sheriging yoʻq; Muhammad esa Sening banding va elchingdir.","q":"","f":"Rasululloh ﷺ: «Kim buni bir marta aytsa, Alloh uning toʻrtdan birini doʻzaxdan ozod qiladi; ikki marta — yarmini; uch marta — toʻrtdan uchini; toʻrt marta aytsa, uni doʻzaxdan butunlay ozod qiladi», dedilar.","m":"Abu Dovud, 5069.","s":["Bu duoda Allohdan hech narsa soʻralmaydi — faqat shahodat aytiladi. Demak, shahodatning oʻzi eng katta talab.","Guvohlikni Allohning Oʻziga, Arsh koʻtaruvchi farishtalarga va butun xalqqa qaratasiz; ular Qiyomat kuni siz uchun guvohlik beradi.","Muhammad ﷺ avval «banda», keyin «elchi» deb atalgan — bandalik eng oliy maqom.","Toʻrt marta shoshmasdan, maʼnosini his qilib ayting; har safar guvohlikning ulushi ortadi."],"tr":"Allohumma inni amsaytu ush-hiduk, wa ush-hidu ḥamalata ʼarshik, wa malaʼikataka wa jamiʼa xolqik, annaka Antalloh, la ilaha illa Anta waḥdaka la sharika lak, wa anna Muḥammadan ʼabduka wa rosuluk."},"ru":{"t":"Освобождение от Огня — четыре раза","tr":"Аллохумма инни амсайту уш-хидук, ва уш-хиду ḥамалята ʼаршик, ва маляʼикатака ва джамиʼа хольqик, аннака Анталлоху, ля иляха илля Анта ваḥдака ля шарика лак, ва анна Муḥаммадан ʼабдука ва росулюк.","mn":"О Аллах, я встретил вечер, призывая в свидетели Тебя, носителей Твоего Трона, Твоих ангелов и всё Твоё творение, что Ты — Аллах, нет божества, кроме Тебя одного, у Тебя нет сотоварища, и что Мухаммад — Твой раб и посланник.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это один раз, Аллах освободит от Огня четверть его; кто скажет дважды — половину; трижды — три четверти; а кто скажет четыре раза, того Аллах полностью освободит от Огня».","m":"Абу Дауд, 5069.","s":["В этом дуа у Аллаха ничего не просят — лишь свидетельствуют. Значит, само свидетельство — величайшая просьба.","Вы обращаете свидетельство к Самому Аллаху, к ангелам-носителям Трона и ко всему творению; они засвидетельствуют за вас в День суда.","Мухаммад ﷺ назван сначала «рабом», затем «посланником» — рабство есть высшая степень.","Четыре раза — не спеша, ощущая смысл; с каждым разом доля свидетельства растёт."]}},{"n":3,"audio":true,"ar":["أَمْسَيْتُ أُثْنِيْ عَلَيْكَ حَمْدًا ، وَأَشْهَدُ أَنْ لَّا إِلٰهَ إِلَّا اللّٰهُ."],"uz":{"t":"Oqshomni hamd bilan boshlash","mn":"Men oqshomga Senga hamd aytib kirdim va guvohlik beramanki, Allohdan oʻzga iloh yoʻq.","q":"","f":"Abu Hurayra roziyallohu anhu rivoyat qiladi: Rasululloh ﷺ: «Biringiz tongni qarshilaganida buni uch marta aytsin; kechqurunga kirganida ham shunday aytsin», dedilar.","m":"Nasoiy, «as-Sunanul-kubro», 10406.","s":["Oqshomni boshlashning hamddan yaxshiroq yoʻli yoʻq. Birinchi ogʻiz soʻzingiz shikoyat emas, maqtov boʻlsin.","«Ḥamd» ikki narsani oʻz ichiga oladi: bergani uchun shukr va Oʻzi shunday Zot boʻlgani uchun maqtov.","Bu zikr koʻp toʻplamlarga kirmagani uchun kam maʼlum, ammo sanadi sahih — unutilgan sunnatni tiklaysiz.","Har takrorda Allohning maqtovga loyiq boshqa sababini eslang."],"tr":"Amsaytu uṡni ʼalayka ḥamdan, wa ash-hadu al-la ilaha illalloh."},"ru":{"t":"Начать вечер с восхваления","tr":"Амсайту уṡни ʼаляйка ḥамдан, ва аш-хаду ал-ля иляха илляллох.","mn":"Я встретил вечер, вознося Тебе хвалу, и свидетельствую, что нет божества, кроме Аллаха.","q":"","f":"Абу Хурайра (да будет доволен им Аллах) передал, что Пророк ﷺ сказал: «Пусть один из вас, встречая утро, скажет это трижды; и то же самое — встречая вечер».","m":"ан-Насаи, «ас-Сунан аль-кубра», 10406.","s":["Нет лучшего начала вечера, чем восхваление Аллаха. Пусть первым словом будет не жалоба, а хвала.","«Ḥамд» включает и благодарность за дарованное, и восхваление Его за то, каков Он Сам.","Этот зикр малоизвестен, так как редко встречается в сборниках, но его иснад достоверен — вы оживляете забытую сунну.","С каждым повтором вспоминайте новую причину, по которой Он достоин хвалы."]}},{"n":1,"audio":true,"ar":["أَمْسَيْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ ، وَعَلَىٰ دِيْنِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ ، وَعَلَىٰ مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُّسْلِمًا وَّمَا كَانَ مِنَ الْمُشْرِكِيْنَ."],"uz":{"t":"Islom fitrati ustida oqshomga kirish","mn":"Biz oqshomga Islom fitrati ustida, ixlos kalimasi ustida, Paygʻambarimiz Muhammad ﷺ ning dini ustida va otamiz Ibrohimning — botildan yuz oʻgirib, Allohga taslim boʻlgan va mushriklardan boʻlmagan zotning millati ustida kirdik.","q":"","f":"Abdurahmon ibn Abzo roziyallohu anhu rivoyat qiladi: Rasululloh ﷺ oqshomda shu duoni aytar edilar.","m":"Ahmad, 15360.","s":["«Fitrat» — inson tugʻilganda beriladigan sof tabiat. Islom unga qarshi emas, aynan unga mos.","Shu sababli gunohga qarab ketish oʻz tabiatingizga qarshi borishdir — shuning uchun ham qalbni bezovta qiladi.","«Ixlos kalimasi» — la ilaha illalloh. Aytganingizda eʼtiqodingizni shirkdan tozalaysiz.","Ibrohim alayhissalom — tavhid imomi; biz bu yoʻlning birinchi yoʻlovchisi emasmiz."],"tr":"Amsayna ʼala fiṭrotil-Islam, wa ʼala kalimatil-ixloṣ, wa ʼala dini Nabiyyina Muḥammadin sollallohu alayhi wa sallam, wa ʼala millati abina Ibrohima ḥanifam-muslima, wa ma kana minal-mushrikin."},"ru":{"t":"Встреча вечера на естестве Ислама","tr":"Амсайна ʼаля фиṭротиль-Ислям, ва ʼаля калиматиль-ихляṣ, ва ʼаля дини Набиййина Муḥаммадин соллаллоху ʼаляйхи ва саллям, ва ʼаля милляти абина Иброхима ḥанифам-муслима, ва ма кана миналь-мушрикин.","mn":"Мы встретили вечер на естестве (фитре) Ислама, на слове искренности, на религии нашего Пророка Мухаммада ﷺ и на общине отца нашего Ибрахима, который был ханифом, покорившимся Аллаху, и не был из многобожников.","q":"","f":"Абдуррахман ибн Абза (да будет доволен им Аллах) передал, что Пророк ﷺ говорил это вечером.","m":"Ахмад, 15360.","s":["«Фитра» — чистое естество, данное человеку при рождении. Ислам не противоречит ему, а полностью ему соответствует.","Поэтому уход в грех — это движение против собственной природы; оттого он и тревожит сердце.","«Слово искренности» — ля иляха илляллах. Произнося его, вы очищаете своё убеждение от многобожия.","Ибрахим (мир ему) — имам единобожия; мы не первые на этом пути."]}},{"n":1,"audio":true,"ar":["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلّٰهِ وَالْحَمْدُ لِلّٰهِ ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِيْ هٰذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْ هٰذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا ، رَبِّ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوْءِ الْكِبَرِ ، رَبِّ أَعُوْذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ."],"uz":{"t":"Shu kechaning yaxshiligini soʻrash","mn":"Biz ham, butun mulk ham oqshomga Allohnikida kirdik. Hamd Allohgadir. Allohdan oʻzga iloh yoʻq, U yakka-yolgʻiz, sherigi yoʻq. Mulk Unikidir, hamd ham Unikidir. U har narsaga Qodirdir.\n\nEy Robbim, Sendan shu kechadagi va undan keyingi yaxshilikni soʻrayman; shu kechadagi va undan keyingi yomonlikdan Sendan panoh soʻrayman. Ey Robbim, dangasalikdan va keksalikning yomonligidan Sendan panoh soʻrayman. Ey Robbim, doʻzax azobidan va qabr azobidan Sendan panoh soʻrayman.","q":"","f":"Abdulloh ibn Masʼud roziyallohu anhu: Rasululloh ﷺ oqshomga kirganlarida shu duoni aytar edilar.","m":"Muslim, 2723.","s":["Duoning birinchi yarmi — maqtov, ikkinchi yarmi — soʻrov. Bu soʻrashning sunnat tartibi: avval taniting, keyin soʻrang.","«Mulk Allohnikida oqshomga kirdi» — dunyodagi hamma rahbar Uning mulki ichida. Bu bandalardan qoʻrquvni oladi.","«Dangasalik» — qoʻlingizdagi toʻsiq; «keksalikning yomonligi» — qoʻlingizda boʻlmagani. Ikkalasidan panoh soʻraladi.","Doʻzax azobi — eng ogʻiri, qabr azobi — eng birinchisi. Duo eng yaqin xavf bilan tugaydi."],"tr":"Amsayna wa amsal-mulku lillah, wal-ḥamdu lillah, la ilaha illalloh waḥdahu la sharika lah, lahul-mulku wa lahul-ḥamd, wa Huwa ʼala kulli shayʼin Qodir. Robbi asʼaluka xoyro ma fi hazihil-laylati wa xoyro ma baʼdaha, wa aʼuzu bika min sharri ma fi hazihil-laylati wa sharri ma baʼdaha. Robbi aʼuzu bika minal-kasali wa suʼil-kibar. Robbi aʼuzu bika min ʼazabin fin-nari wa ʼazabin fil-qobr."},"ru":{"t":"Просьба о благе этой ночи","tr":"Амсайна ва амсаль-мульку лиллях, валь-ḥамду лиллях, ля иляха илляллоху ваḥдаху ля шарика лях, ляхуль-мульку ва ляхуль-ḥамд, ва Хува ʼаля кулли шайʼин Qодир. Робби асʼалюка хойро ма фи хазихиль-ляйляти ва хойро ма баʼдаха, ва аʼузу бика мин шарри ма фи хазихиль-ляйляти ва шарри ма баʼдаха. Робби аʼузу бика миналь-касали ва суʼиль-кибар. Робби аʼузу бика мин ʼазабин фин-нари ва ʼазабин филь-qобр.","mn":"Мы встретили вечер, и владычество этим вечером принадлежит Аллаху. Хвала Аллаху. Нет божества, кроме Аллаха, Единственного, у Которого нет сотоварища. Ему владычество, Ему хвала, и Он над всякой вещью мощен.\n\nГосподи, прошу у Тебя блага этой ночи и блага того, что после неё; и прибегаю к Тебе от зла этой ночи и зла того, что после неё. Господи, прибегаю к Тебе от лени и дурной старости. Господи, прибегаю к Тебе от мучения в Огне и мучения в могиле.","q":"","f":"Абдуллах ибн Масʼуд (да будет доволен им Аллах) передал, что Пророк ﷺ говорил это, встречая вечер.","m":"Муслим, 2723.","s":["Первая половина дуа — восхваление, вторая — просьба. Таков сунновый порядок: сначала познакомь, затем проси.","«Владычество этим вечером принадлежит Аллаху» — все правители мира внутри Его владения. Это убирает страх перед людьми.","«Лень» — препятствие в ваших руках; «дурная старость» — то, что не в ваших руках. Просят защиты от обоих.","Мучение в Огне — тягчайшее, мучение в могиле — первое. Дуа завершается ближайшей опасностью."]}},{"n":1,"audio":true,"ar":["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَ هٰذِهِ اللَّيْلَةِ ، فَتْحَهَا وَنَصْرَهَا وَنُوْرَهَا وَبَرَكَتَهَا وَهُدَاهَا ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْهَا وَشَرِّ مَا بَعْدَهَا."],"uz":{"t":"Kechangizga baraka soʻrash","mn":"Biz ham, butun mulk ham oqshomga olamlar Robbi boʻlmish Allohnikida kirdik. Ey Alloh, Sendan shu kechaning yaxshiligini soʻrayman: uning ochilishini, nusratini, nurini, barakasini va hidoyatini. Undagi va undan keyingi yomonlikdan Sendan panoh soʻrayman.","q":"","f":"Abu Molik al-Ashʼariy roziyallohu anhu: Rasululloh ﷺ: «Biringiz tongni qarshilaganida buni aytsin; kechqurunga kirganida ham shunday aytsin», dedilar.","m":"Abu Dovud, 5084.","s":["«Fatḥ» — ochilish: rizq, ilm, hidoya eshiklarining ochilishi va tugunlarning yechilishi.","«Naṣr» — nusrat; buni faqat tashqi dushmanga qarshi deb bilmang, eng qattiq jang nafsingiz bilan boʻladi.","«Nur» — hidoyat va imon nuri, foydali ilm va solih amal.","«Baraka» — miqdorning emas, samaraning ortishi. Kimdir oz uxlab tetik, kimdir koʻp uxlab holsiz — farq barakada."],"tr":"Amsayna wa amsal-mulku lillahi Robbil-ʼalamin. Allohumma inni asʼaluka xoyro hazihil-laylah: fatḥaha wa naṣroha wa nuroha wa barokataha wa hudaha, wa aʼuzu bika min sharri ma fiha wa sharri ma baʼdaha."},"ru":{"t":"Просьба о благодати ночи","tr":"Амсайна ва амсаль-мульку лилляхи Роббиль-ʼалямин. Аллохумма инни асʼалюка хойро хазихиль-ляйлях: фатḥаха ва наṣроха ва нуроха ва барокатаха ва худаха, ва аʼузу бика мин шарри ма фиха ва шарри ма баʼдаха.","mn":"Мы встретили вечер, и владычество этим вечером принадлежит Аллаху, Господу миров. О Аллах, прошу у Тебя блага этой ночи: её открытия, помощи, света, благодати и верного руководства; и прибегаю к Тебе от зла того, что в ней, и зла того, что после неё.","q":"","f":"Абу Малик аль-Ашʼари (да будет доволен им Аллах) передал, что Пророк ﷺ сказал: «Пусть один из вас, встречая утро, скажет это; и то же самое — встречая вечер».","m":"Абу Дауд, 5084.","s":["«Фатḥ» — открытие: врат удела, знания, руководства и развязывание узлов.","«Наṣр» — помощь; не думайте о ней лишь против внешнего врага, ведь тягчайшая битва — с собственной душой.","«Нур» — свет веры и руководства, полезное знание и праведное дело.","«Барака» — приумножение не количества, а плода. Кто-то спит мало и бодр, кто-то много и обессилен — разница в благодати."]}},{"n":1,"audio":true,"ar":["اَللّٰهُمَّ بِكَ أَمْسَيْنَا ، وَبِكَ أَصْبَحْنَا ، وَبِكَ نَحْيَا ، وَبِكَ نَمُوْتُ ، وَإِلَيْكَ الْمَصِيْرُ."],"uz":{"t":"Sen bilan oqshomga kirdik","mn":"Ey Alloh, Sen bilan oqshomga kirdik, Sen bilan tongni qarshiladik, Sen bilan yashaymiz, Sen bilan oʻlamiz va qaytish ham Sengadir.","q":"","f":"Abu Hurayra roziyallohu anhu: Rasululloh ﷺ oqshomda shu duoni aytar edilar; tongda esa «Allohumma bika asbaḥna...» deb boshlar edilar.","m":"Termiziy, 3391; Abu Dovud, 5068; Ibn Moja, 3868.","s":["Toʻrt marta «Sen bilan» takrorlanadi: oqshom, tong, hayot, oʻlim — hech biri sizning kuchingiz bilan emas.","Duo «va ilaykal-maṣir» — «qaytish Sengadir» bilan tugaydi; kunning oxirida oxirat eslatiladi.","Uyqu — kichik oʻlim, uygʻonish — kichik qayta tirilish. Har kecha Qiyomatning kichik mashqidan oʻtasiz.","Qisqa, lekin butun umr xaritasini bir jumlaga sigʻdiradi: kelish, yashash, ketish, qaytish."],"tr":"Allohumma bika amsayna, wa bika asbaḥna, wa bika naḥya, wa bika namut, wa ilaykal-maṣir."},"ru":{"t":"С Тобою мы встретили вечер","tr":"Аллохумма бика амсайна, ва бика аṣбаḥна, ва бика наḥйа, ва бика намут, ва иляйкаль-маṣир.","mn":"О Аллах, с Тобою мы встретили вечер, с Тобою встречаем утро, с Тобою живём, с Тобою умираем, и к Тебе — возвращение.","q":"","f":"Абу Хурайра (да будет доволен им Аллах) передал, что Пророк ﷺ говорил это вечером; а утром начинал со слов «Аллахумма бика асбахна…».","m":"ат-Тирмизи, 3391; Абу Дауд, 5068; Ибн Маджа, 3868.","s":["Четырежды повторяется «с Тобою»: вечер, утро, жизнь, смерть — ни одно не вашей силой.","Дуа завершается «к Тебе — возвращение»; в конце дня напоминается о Последней жизни.","Сон — малая смерть, пробуждение — малое воскрешение. Каждую ночь вы проходите малую репетицию Судного дня.","Коротко, но вмещает всю карту жизни в одну фразу: приход, жизнь, уход, возвращение."]}},{"n":1,"audio":true,"ar":["اَللّٰهُمَّ مَا أَمْسَىٰ بِيْ مِنْ نِّعْمَةٍ أَوْ بِأَحَدٍ مِّنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ."],"uz":{"t":"Shukr qarzini ado etish","mn":"Ey Alloh, menga yoki xalqingdan birortasiga oqshomda yetgan har qanday neʼmat faqat Sendandir; Sen yakka-yolgʻizsan, sheriging yoʻq. Hamd ham Senga, shukr ham Sengadir.","q":"","f":"Abdulloh ibn Gʻannom roziyallohu anhu: Rasululloh ﷺ: «Kim ertalab buni aytsa, oʻsha kunning shukrini ado etgan boʻladi; kechqurun aytsa, oʻsha tunning shukrini ado etgan boʻladi», dedilar.","m":"Abu Dovud, 5073.","s":["Neʼmatlar sanab boʻlmas, ammo shu bir jumla bilan bugungi shukr qarzi uziladi. Bu — Allohning karamining oʻzi yana bir neʼmat.","Aniq neʼmat tilga olinmagan: bilgan ham, bilmagan ham, dunyoviy ham, oxiratga oid ham neʼmatlar shukriga kiradi.","«Xalqingdan birortasiga» — boshqalarning neʼmatiga ham shukr qilish oʻrgatiladi.","Alloh aytadi: «Agar shukr qilsangiz, albatta, sizga ziyoda qilaman» (Ibrohim, 7)."],"tr":"Allohumma ma amsa bi min niʼmatin aw bi-aḥadim-min xolqik, fa-minka waḥdaka la sharika lak, fa lakal-ḥamdu wa lakash-shukr."},"ru":{"t":"Исполнить долг благодарности","tr":"Аллохумма ма амса би мин ниʼматин ав би-аḥадим-мин хольqик, фа-минка ваḥдака ля шарика лак, фа лякаль-ḥамду ва лякаш-шукр.","mn":"О Аллах, какое бы благо ни пришло ко мне или к кому-либо из Твоих творений этим вечером — оно только от Тебя одного, у Тебя нет сотоварища. Тебе хвала и Тебе благодарность.","q":"","f":"Абдуллах ибн Ганнам (да будет доволен им Аллах) передал, что Пророк ﷺ сказал: «Кто скажет это утром, тот исполнит долг благодарности за этот день; а кто скажет вечером — за эту ночь».","m":"Абу Дауд, 5073.","s":["Благ не счесть, но этой одной фразой закрывается долг благодарности за ночь. Сама эта милость Аллаха — ещё одно благо.","Конкретное благо не названо: так в благодарность входят и известные, и неведомые, и мирские, и относящиеся к Последней жизни блага.","«Или к кому-либо из Твоих творений» — учит быть благодарным и за блага других.","Аллах говорит: «Если вы будете благодарны, Я одарю вас ещё больше» (14:7)."]}},{"n":1,"audio":true,"ar":["يَا حَيُّ يَا قَيُّوْمُ ، بِرَحْمَتِكَ أَسْتَغِيْثُ ، أَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ ، وَلَا تَكِلْنِيْ إِلَىٰ نَفْسِيْ طَرْفَةَ عَيْنٍ."],"uz":{"t":"Ishlaringizni Allohga topshiring","mn":"Ey abadiy Tirik, ey borliqni Tutib turuvchi! Rahmating bilan Sendan madad soʻrayman. Barcha ishlarimni oʻnglab qoʻy va meni bir koʻz yumib ochguncha ham oʻzimga tashlab qoʻyma.","q":"","f":"Anas ibn Molik roziyallohu anhu: Rasululloh ﷺ qizlari Fotimaga: «Ertalab va kechqurun shu duoni aytishingdan seni nima toʻsib turibdi?» dedilar.","m":"Nasoiy, «Amalul-yavm val-layla», 570; Hokim, 1/545.","s":["Duo Allohning ikki ismi bilan boshlanadi: al-Ḥayy va al-Qoyyum. Koʻp ulamolar Ismi Aʼzam shu ikkisida deb bilishgan.","Nimaga madad soʻralayotgani aytilmagan — chunki hamma narsaga; biz hech narsada oʻzimizga tayana olmaymiz.","«Bir koʻz yumib ochguncha ham» — Rasululloh ﷺ ning qizlariga oʻrgatgan oʻlchovi shu. Bir soniya ham emas.","Bu duo bilan kuniga 17 marta oʻqiladigan oyatni amalda bajarasiz: «Faqat Senga ibodat qilamiz va faqat Sendan yordam soʻraymiz»."],"tr":"Ya Ḥayyu ya Qoyyum, bi-roḥmatika astagʻiṡu, aṣliḥ li shaʼni kullah, wa la takilni ila nafsi ṭarfata ʼayn."},"ru":{"t":"Вверьте свои дела Аллаху","tr":"Йа Ḥаййу йа Qоййум, би-роḥматика астаġиṡу, аṣлиḥ ли шаʼни куллях, ва ля такильни иля нафси ṭорфата ʼайн.","mn":"О Вечно Живой, о Поддерживающий бытие! Твоей милостью взываю о помощи. Исправь все мои дела и не оставляй меня самому себе даже на мгновение ока.","q":"","f":"Анас ибн Малик (да будет доволен им Аллах) передал, что Пророк ﷺ сказал своей дочери Фатиме: «Что мешает тебе говорить утром и вечером то, что я тебе завещаю?»","m":"ан-Насаи, «Амаль аль-йаум ва-ль-лейля», 570; аль-Хаким, 1/545.","s":["Дуа начинается двумя именами: аль-Ḥайй и аль-Qоййум. Многие учёные считают, что Величайшее имя — в этих двух.","О чём именно просьба о помощи — не названо, ведь во всём; мы ни в чём не можем опереться на себя.","«Даже на мгновение ока» — такова мера, которой Пророк ﷺ научил свою дочь. Не на секунду.","Этим дуа вы исполняете на деле аят, читаемый 17 раз в день: «Тебе одному мы поклоняемся и Тебя одного молим о помощи»."]}},{"n":3,"audio":true,"ar":["اَللّٰهُمَّ عَافِنِيْ فِيْ بَدَنِيْ ، اَللّٰهُمَّ عَافِنِيْ فِيْ سَمْعِيْ ، اَللّٰهُمَّ عَافِنِيْ فِيْ بَصَرِيْ ، لَا إِلٰهَ إِلَّا أَنْتَ. اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ ، وَأَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلٰهَ إِلَّا أَنْتَ."],"uz":{"t":"Tan, quloq va koʻz salomatligi — uch marta","mn":"Ey Alloh, tanimga ofiyat ber. Ey Alloh, qulogʻimga ofiyat ber. Ey Alloh, koʻzimga ofiyat ber. Sendan oʻzga iloh yoʻq. Ey Alloh, kufrdan va faqirlikdan Sendan panoh soʻrayman; qabr azobidan Sendan panoh soʻrayman. Sendan oʻzga iloh yoʻq.","q":"","f":"Abu Bakra roziyallohu anhu shu duoni ertalab va kechqurun uch martadan aytar, oʻgʻli Abdurahmon undan oʻrganib, otasi bu duoni Rasululloh ﷺ dan eshitganini aytardi.","m":"Abu Dovud, 5090; Ahmad, 20430.","s":["Butun tan aytilgach, quloq va koʻz alohida tilga olinadi — ilm ham, fitna ham asosan shu ikki eshikdan kiradi.","«Ofiyat» — nafaqat kasallikdan xalos boʻlish, balki tan, aql va qalbning sogʻlom boʻlishi.","Kufr va faqirlik yonma-yon keladi: biri dinni, ikkinchisi dunyoni buzadi.","Sogʻliq — yoʻqotmaguningizcha qadri bilinmaydigan neʼmat; shuning uchun har kuni soʻrash oʻrgatilgan."],"tr":"Allohumma ʼafini fi badani, Allohumma ʼafini fi samʼi, Allohumma ʼafini fi baṣori, la ilaha illa Ant. Allohumma inni aʼuzu bika minal-kufri wal-faqr, wa aʼuzu bika min ʼazabil-qobr, la ilaha illa Ant."},"ru":{"t":"Здоровье тела, слуха и зрения — три раза","tr":"Аллохумма ʼафини фи бадани, Аллохумма ʼафини фи самʼи, Аллохумма ʼафини фи баṣори, ля иляха илля Ант. Аллохумма инни аʼузу бика миналь-куфри валь-фаqр, ва аʼузу бика мин ʼазабиль-qобр, ля иляха илля Ант.","mn":"О Аллах, даруй здоровье моему телу. О Аллах, даруй здоровье моему слуху. О Аллах, даруй здоровье моему зрению. Нет божества, кроме Тебя. О Аллах, прибегаю к Тебе от неверия и нищеты; и прибегаю к Тебе от мучения в могиле. Нет божества, кроме Тебя.","q":"","f":"Абу Бакра (да будет доволен им Аллах) читал это дуа утром и вечером по три раза, а его сын Абдуррахман перенял это от него, передавая, что отец слышал его от Пророка ﷺ.","m":"Абу Дауд, 5090; Ахмад, 20430.","s":["После всего тела отдельно упоминаются слух и зрение — ведь и знание, и смута входят в основном через эти двери.","«ʼАфия» — не только избавление от болезни, но и здравие тела, разума и сердца.","Неверие и нищета идут рядом: одно разрушает религию, другое — мирскую жизнь.","Здоровье — благо, ценность которого познаётся лишь после утраты; потому и велено просить его каждый день."]}},{"n":1,"audio":true,"ar":["اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِيْ دِيْنِيْ وَدُنْيَايَ وَأَهْلِيْ وَمَالِيْ ، اَللّٰهُمَّ اسْتُرْ عَوْرَاتِيْ وَآمِنْ رَوْعَاتِيْ ، اَللّٰهُمَّ احْفَظْنِيْ مِنْ بَيْنِ يَدَيَّ ، وَمِنْ خَلْفِيْ ، وَعَنْ يَّمِيْنِيْ ، وَعَنْ شِمَالِيْ ، وَمِنْ فَوْقِيْ ، وَأَعُوْذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِيْ."],"uz":{"t":"Dunyo va oxiratda avf va ofiyat","mn":"Ey Alloh, dunyo va oxiratda Sendan avf va ofiyat soʻrayman. Ey Alloh, dinimda, dunyomda, ahlim va molimda Sendan avf va ofiyat soʻrayman. Ey Alloh, ayb-nuqsonlarimni yashir va qoʻrquvlarimni tinchit. Ey Alloh, meni oldimdan, ortimdan, oʻngimdan, chapimdan va ustimdan asra; ostimdan kutilmaganda halok qilinishimdan Sening ulugʻliging bilan panoh soʻrayman.","q":"","f":"Ibn Umar roziyallohu anhumo: Rasululloh ﷺ ertalab va kechqurun bu duolarni aytishni tark qilmas edilar.","m":"Abu Dovud, 5074; Ibn Moja, 3871; Nasoiy, «Amalul-yavm val-layla», 566.","s":["Avval umumiy soʻraladi — «dunyo va oxiratda». Keyin xuddi shu soʻrov toʻrt sohaga boʻlib takrorlanadi. Bu takror emas, isror — Alloh isror bilan soʻralishini yaxshi koʻradi.","Din, dunyo, ahl va mol — hayotning toʻrt ustuni; bittasi buzilsa, qolgani ham qiynaladi.","Oxirgi qism olti yoʻnalishni qamrab oladi. Shaytonning vaʼdasi toʻrt tomondan edi (Aʼrof, 17); duo unga yana ikkitasini — ust va ostni — qoʻshadi.","Ost tomon boshqacha — «ulugʻliging bilan panoh» deb soʻraladi, chunki ostdan halokat (yerga yutilish) Allohning jazosi boʻlgan."],"tr":"Allohumma inni asʼalukal-ʼafwa wal-ʼafiyata fid-dunya wal-oxiroh. Allohumma inni asʼalukal-ʼafwa wal-ʼafiyata fi dini wa dunyaya wa ahli wa mali. Allohummastur ʼawroti wa amin rawʼati. Allohummaḥfaẓni min bayni yadayya, wa min xolfi, wa ʼan yamini, wa ʼan shimali, wa min fawqi, wa aʼuzu bi-ʼaẓomatika an ugʻtala min taḥti."},"ru":{"t":"Прощение и благополучие в обоих мирах","tr":"Аллохумма инни асʼалюкаль-ʼафва валь-ʼафията фид-дунйа валь-ахироh. Аллохумма инни асʼалюкаль-ʼафва валь-ʼафията фи дини ва дунйайа ва ахли ва мали. Аллохуммастур ʼаврати ва амин раʼвати. Аллохуммаḥфаẓни мин байни йадаййа, ва мин хольфи, ва ʼан йамини, ва ʼан шимали, ва мин фауqи, ва аʼузу би-ʼаẓоматика ан уġталя мин таḥти.","mn":"О Аллах, прошу у Тебя прощения и благополучия в этом мире и в Последней жизни. О Аллах, прошу у Тебя прощения и благополучия в моей религии, моей жизни, моей семье и моём имуществе. О Аллах, прикрой мои изъяны и успокой мои страхи. О Аллах, храни меня спереди, сзади, справа, слева и сверху; и прибегаю к Твоему величию от того, чтобы быть погублённым снизу.","q":"","f":"Ибн Умар (да будет доволен Аллах ими обоими) передал: Пророк ﷺ не оставлял этих дуа утром и вечером.","m":"Абу Дауд, 5074; Ибн Маджа, 3871; ан-Насаи, «Амаль аль-йаум ва-ль-лейля», 566.","s":["Сначала просят общо — «в этом мире и в Последней жизни». Затем та же просьба повторяется по четырём областям. Это не повтор, а настойчивость — Аллах любит, когда Его просят настойчиво.","Религия, жизнь, семья и имущество — четыре опоры человека; расстроится одна — страдают и остальные.","Последняя часть охватывает шесть направлений. Обещание шайтана было с четырёх сторон (7:17); дуа добавляет ещё две — сверху и снизу.","О защите снизу просят иначе — «Твоим величием», ведь гибель снизу (провалиться сквозь землю) была наказанием Аллаха."]}},{"n":1,"audio":true,"ar":["اَللّٰهُمَّ فَاطِرَ السَّمٰوَاتِ وَالْأَرْضِ ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، لَا إِلٰهَ إِلَّا أَنْتَ ، رَبَّ كُلِّ شَيْءٍ وَّمَلِيْكَهُ ، أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ ، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَىٰ نَفْسِيْ سُوْءًا أَوْ أَجُرَّهُ إِلَىٰ مُسْلِمٍ."],"uz":{"t":"Toʻrt xil yomonlikdan panoh","mn":"Ey Alloh, osmonlaru yerni yaratgan Zot! Gʻayb va oshkorni Bilguvchi! Sendan oʻzga iloh yoʻq, Sen har narsaning Robbi va Egasisan. Nafsimning yomonligidan, shaytonning yomonligidan va u chaqiradigan shirkdan Sendan panoh soʻrayman; oʻzimga yomonlik qilishimdan yoki uni biror musulmonga yetkazishimdan ham panoh soʻrayman.","q":"","f":"Abu Bakr Siddiq roziyallohu anhu: «Ey Allohning Rasuli, ertalab va kechqurun nima deyishimni oʻrgating», dedilar. Rasululloh ﷺ shu duoni oʻrgatib: «Buni ertalab, kechqurun va uyquga yotganingda ayt», dedilar.","m":"Termiziy, 3529 (shu lafz bilan) va 3392; Abu Dovud, 5067.","s":["Duoning yarmi maqtovdan iborat: yaratish, ilm, egalik. Soʻrov qanchalik katta boʻlsa, maqtov ham shunchalik uzun.","Yomonlikning ikki manbai bor: ichkaridan — nafs, tashqaridan — shayton. Duo ikkalasini ham qamrab oladi.","Yomonlikning ikki qabul qiluvchisi bor: oʻzingiz va boshqalar. Duo ikkalasidan ham panoh soʻraydi — mana «toʻrt yomonlik».","Mazlum boʻlishdan panoh soʻragan odam zolim boʻlishdan ham panoh soʻrasin."],"tr":"Allohumma faṭiros-samawati wal-arḍ, ʼalimal-gʻaybi wash-shahadah, la ilaha illa Ant, Robba kulli shayʼin wa malikah, aʼuzu bika min sharri nafsi, wa min sharrish-shayṭoni wa shirkih, wa an aqtarifa ʼala nafsi suʼan aw ajurrohu ila muslim."},"ru":{"t":"Защита от четырёх зол","tr":"Аллохумма фаṭирос-самавати валь-арḍ, ʼалималь-ġойби ваш-шахадаh, ля иляха илля Ант, Робба кулли шайʼин ва маликях, аʼузу бика мин шарри нафси, ва мин шарриш-шайṭони ва ширких, ва ан аqтарифа ʼаля нафси суʼан ав аджурроху иля муслим.","mn":"О Аллах, Творец небес и земли, Знающий сокровенное и явное! Нет божества, кроме Тебя, Господа и Владыки всякой вещи. Прибегаю к Тебе от зла моей души, от зла шайтана и его призыва к многобожию; и от того, чтобы совершить зло против себя или навлечь его на мусульманина.","q":"","f":"Абу Бакр ас-Сыддик (да будет доволен им Аллах) попросил: «О Посланник Аллаха, научи меня, что говорить утром и вечером». Пророк ﷺ научил его этому дуа и сказал: «Говори это утром, вечером и когда ложишься спать».","m":"ат-Тирмизи, 3529 (в этой редакции) и 3392; Абу Дауд, 5067.","s":["Половина дуа — восхваление: творение, знание, владычество. Чем больше просьба, тем длиннее восхваление.","У зла два источника: изнутри — душа, извне — шайтан. Дуа охватывает оба.","У зла два получателя: вы сами и другие. Дуа просит защиты от обоих — вот эти «четыре зла».","Кто просит защиты от того, чтобы стать притеснённым, пусть просит и от того, чтобы стать притеснителем."]}},{"n":1,"audio":true,"ar":["اَللّٰهُمَّ أَنْتَ رَبِّيْ لَا إِلٰهَ إِلَّا أَنْتَ ، خَلَقْتَنِيْ وَأَنَا عَبْدُكَ ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوْءُ لَكَ بِذَنْبِيْ ، فَاغْفِرْ لِيْ فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ."],"uz":{"t":"Sayyidul-Istigʻfor — magʻfiratning eng afzali","mn":"Ey Alloh, Sen mening Robbimsan. Sendan oʻzga iloh yoʻq. Meni Sen yaratgansan, men esa Sening bandangman. Kuchim yetguncha ahdim va vaʼdamda turibman. Qilgan ishlarim yomonligidan Sendan panoh soʻrayman. Menga bergan neʼmatingni ham, qilgan gunohimni ham tan olaman. Meni kechir — gunohlarni Sendan oʻzga hech kim kechirmaydi.","q":"","f":"Shaddod ibn Avs roziyallohu anhu: Rasululloh ﷺ: «Istigʻforning sayyidi — bandaning shuni aytishidir. Kim uni kunduzi yaqiyn bilan aytib, oʻsha kuni kechga qadar vafot etsa — u jannat ahlidan. Kim uni kechasi yaqiyn bilan aytib, tongga qadar vafot etsa — u ham jannat ahlidan», dedilar.","m":"Buxoriy, 6306.","s":["Kechirim soʻrash duoning eng oxirida keladi. Undan oldin oltita zina bor: Allohni ulugʻlash, ahdni tan olish, vaʼdaga umid, yomonlikdan panoh, neʼmatni tan olish, gunohni tan olish.","«Kuchim yetguncha» — ochiq tan olish: biz Uni loyiq darajada hech qachon ibodat qila olmaymiz.","Ibnul Qoyyim rohimahulloh: neʼmatni tan olish sevgi va shukrga, aybni tan olish tavba va ojizlikka olib boradi. Orif Allohga shu ikki qanot bilan uchadi.","«Yaqiyn bilan» degan shart bor; yaqiyn esa maʼnoni bilishdan tugʻiladi — shuning uchun tarjimasini oʻqiyapsiz."],"tr":"Allohumma Anta Robbi, la ilaha illa Ant, xolaqtani wa ana ʼabduk, wa ana ʼala ʼahdika wa waʼdika mastaṭoʼt, aʼuzu bika min sharri ma ṣonaʼt, abuʼu laka bi-niʼmatika ʼalayya wa abuʼu laka bi-zanbi fagʻfir li fa-innahu la yagʻfiruz-zunuba illa Ant."},"ru":{"t":"Сайид аль-истигфар — лучшая форма покаяния","tr":"Аллохумма Анта Робби, ля иляха илля Ант, холяqтани ва ана ʼабдук, ва ана ʼаля ʼахдика ва ваʼдика мастаṭоʼт, аʼузу бика мин шарри ма ṣонаʼт, абуʼу ляка би-ниʼматика ʼаляйя ва абуʼу ляка би-занби фаġфир ли фа-иннаху ля яġфируз-зунуба илля Ант.","mn":"О Аллах, Ты — мой Господь, нет божества, кроме Тебя. Ты создал меня, и я — Твой раб. Я держусь Твоего завета и обещания, насколько могу. Прибегаю к Тебе от зла того, что я совершил. Признаю Твою милость ко мне и признаю свой грех. Прости же меня, ведь никто не прощает грехи, кроме Тебя.","q":"","f":"Шаддад ибн Аус (да будет доволен им Аллах) передал, что Пророк ﷺ сказал: «Господин покаяний — это когда раб говорит это. Кто скажет его днём с убеждённостью и умрёт в тот же день до вечера — тот из обитателей Рая. И кто скажет его ночью с убеждённостью и умрёт до утра — тот из обитателей Рая».","m":"аль-Бухари, 6306.","s":["Просьба о прощении стоит в самом конце. До неё — шесть ступеней: возвеличивание Аллаха, признание завета, надежда на обещание, защита от зла, признание милости и признание греха.","«Насколько могу» — открытое признание: мы никогда не поклоняемся Ему так, как Он того достоин.","Ибн аль-Каййим: признание милости ведёт к любви и благодарности, а признание греха — к покаянию и смирению. Познавший летит к Аллаху на этих двух крыльях.","Есть условие «с убеждённостью»; убеждённость же рождается из понимания смысла — потому вы и читаете перевод."]}},{"n":100,"audio":false,"ar":["أَسْتَغْفِرُ اللّٰهَ."],"uz":{"t":"Istigʻfor — yuz marta","mn":"Allohdan magʻfirat soʻrayman.","q":"","f":"Rasululloh ﷺ: «Ey odamlar, Allohga tavba qilinglar. Men kuniga yuz marta Unga tavba qilaman», dedilar. Boshqa rivoyatda: «Men kuniga yuz marta Allohdan magʻfirat soʻrayman.»","m":"Muslim, 2702; Buxoriy, 6307.","s":["Kuniga yuz marta istigʻfor aytgan zot — gunohi kechirilgan Paygʻambar edi. Bizning holimiz qanday?","Istigʻfor faqat gunohni oʻchirmaydi: «Robbingizdan magʻfirat soʻranglar... U sizga moʻl yomgʻir, mol-dunyo va farzandlar beradi» (Nuh, 10-12).","Bu zikrni yurishda, uy ishida, navbat kutayotib ham aytish mumkin. Til band boʻlmagan har lahza — imkoniyat.","Toʻliqroq shakli: «Astagʻfirullaha wa atubu ilayh» — magʻfirat soʻrayman va Unga tavba qilaman."],"tr":"Astagʻfirulloh."},"ru":{"t":"Истигфар — сто раз","tr":"Астаġфируллох.","mn":"Прошу прощения у Аллаха.","q":"","f":"Пророк ﷺ сказал: «О люди, кайтесь Аллаху. Поистине, я каюсь Ему сто раз в день». В другом предании: «Я прошу прощения у Аллаха сто раз в день».","m":"Муслим, 2702; аль-Бухари, 6307.","s":["Сто раз в день просил прощения тот, чьи грехи были прощены, — Пророк ﷺ. Каково же наше положение?","Истигфар не только стирает грех: «Просите прощения у вашего Господа… Он ниспошлёт вам обильные дожди, поддержит вас имуществом и детьми» (71:10–12).","Этот зикр можно произносить на ходу, за домашним делом, в ожидании очереди. Каждый миг, когда язык свободен, — возможность.","Более полная форма: «Астагфируллаха ва атубу иляйх» — прошу прощения у Аллаха и каюсь Ему."]}},{"n":100,"audio":false,"ar":["سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ."],"uz":{"t":"Subhanallohi va bi-hamdih — yuz marta","mn":"Allohni hamdi bilan poklab yod etaman.","q":"","f":"Rasululloh ﷺ: «Kim kuniga yuz marta “Subhanallohi wa bi-hamdih” desa, gunohlari dengiz koʻpigicha boʻlsa ham toʻkib tashlanadi», dedilar.","m":"Buxoriy, 6405; Muslim, 2691.","s":["«Subhanalloh» — Allohni har qanday kamchilikdan pok deb bilish; «bi-hamdih» — hamd bilan birga. Inkor va isbot bir jumlada.","Bu — tilda eng yengil, tarozida eng ogʻir kalimalardan biri.","Rasululloh ﷺ: «Allohga eng suyukli toʻrt kalima: Subhanalloh, alhamdulillah, la ilaha illalloh, Allohu akbar» (Muslim, 2137).","Yuz marta taxminan uch daqiqa; yoʻlda, ishda ham aytiladi — tahorat ham, joynamoz ham shart emas."],"tr":"Subḥanallohi wa bi-ḥamdih."},"ru":{"t":"Субхьаналлахи ва бихьамдих — сто раз","tr":"Субḥаналлохи ва би-ḥамдих.","mn":"Пречист Аллах и хвала Ему.","q":"","f":"Пророк ﷺ сказал: «Кто скажет сто раз в день «Субхьаналлахи ва бихьамдих», с того будут сняты грехи, даже если они как пена морская».","m":"аль-Бухари, 6405; Муслим, 2691.","s":["«Субхьаналлах» — признание Аллаха пречистым от всякого изъяна; «ва бихьамдих» — вместе с хвалой. Отрицание и утверждение в одной фразе.","Это одно из самых лёгких для языка и тяжёлых на весах слов.","Пророк ﷺ сказал: «Самые любимые Аллаху четыре слова: Субхьаналлах, Альхьамдулиллях, Ля иляха илляллах, Аллаху акбар» (Муслим, 2137).","Сто раз — около трёх минут; произносится и в пути, и за делом — не нужны ни омовение, ни коврик."]}},{"n":100,"audio":false,"ar":["لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ."],"uz":{"t":"Tavhid kalimasi — yuz marta","mn":"Allohdan oʻzga ibodatga loyiq iloh yoʻq. U yakka-yolgʻiz, sherigi yoʻq. Mulk Unikidir, hamd ham Unikidir. U har narsaga Qodirdir.","q":"","f":"Rasululloh ﷺ: «Kim kuniga yuz marta buni aytsa, unga oʻn qulni ozod qilgancha savob boʻladi; yuz yaxshilik yoziladi, yuz gunohi oʻchiriladi va u kun kirguncha shaytondan himoyada boʻladi», dedilar.","m":"Buxoriy, 3293 va 6403; Muslim, 2691.","s":["Bir hadisda uchta savob: oʻn qul ozod qilish, yuz yaxshilik va kun boʻyi shaytondan himoya.","Azkorlar boshida bu kalimani oʻn marta aytgan edingiz; bu — oʻsha kalimaning toʻliq oʻlchovi.","«Mulk Unikidir» — kimdandir umid qilsangiz, avval buni eslang: mulk Egasi qoʻlida.","Yuz marta bir oʻtirishda boʻlishi shart emas; kun boʻyi boʻlib-boʻlib ayting."],"tr":"La ilaha illalloh, waḥdahu la sharika lah, lahul-mulku wa lahul-ḥamd, wa Huwa ʼala kulli shayʼin Qodir."},"ru":{"t":"Слово единобожия — сто раз","tr":"Ля иляха илляллоху ваḥдаху ля шарика лях, ляхуль-мульку ва ляхуль-ḥамд, ва Хува ʼаля кулли шайʼин Qодир.","mn":"Нет божества, кроме Аллаха, Единственного, у Которого нет сотоварища. Ему владычество, Ему хвала, и Он над всякой вещью мощен.","q":"","f":"Пророк ﷺ сказал: «Кто скажет это сто раз в день, тому будет награда как за освобождение десяти рабов; ему запишут сто благодеяний, сотрут сто грехов, и он будет защищён от шайтана до вечера».","m":"аль-Бухари, 3293 и 6403; Муслим, 2691.","s":["В одном хадисе — три награды: освобождение десяти рабов, сто благодеяний и защита от шайтана на весь день.","В начале азкаров вы говорили это слово десять раз; здесь — его полная мера.","«Ему владычество» — если на кого-то надеетесь, вспомните: власть в руках её Владельца.","Сто раз не обязательно за один присест; говорите по частям в течение дня."]}},{"n":10,"audio":false,"ar":["اَللّٰهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ."],"uz":{"t":"Paygʻambarimizga solavot — oʻn marta","mn":"Ey Alloh, Paygʻambarimiz Muhammadga salot va salom yoʻlla.","q":"","f":"Rasululloh ﷺ: «Kim menga bir marta solavot aytsa, Alloh unga oʻn marta rahmat yoʻllaydi», dedilar. Boshqa rivoyatda: «Kim ertalab oʻn marta va kechqurun oʻn marta solavot aytsa, Qiyomat kuni unga shafoatim yetadi.»","m":"Muslim, 408; Tabaroniy, «al-Muʼjamul-avsat», 1662.","s":["Solavot — Rasululloh ﷺ ga bergan qarzimizning kichik bir qismi; u zotning sababi bilan bu hidoyatni topdik.","Siz u zotga solavot aytasiz, foydasi esa sizga qaytadi — bir solavotga oʻn rahmat.","Solavot hech qachon rad qilinmaydi; shuning uchun duoni solavot bilan boshlang va yakunlang.","Juma kuni solavotni koʻpaytirish alohida sunnat."],"tr":"Allohumma ṣolli wa sallim ʼala Nabiyyina Muḥammad."},"ru":{"t":"Салават Пророку ﷺ — десять раз","tr":"Аллохумма ṣолли ва саллим ʼаля Набиййина Муḥаммад.","mn":"О Аллах, благослови и приветствуй нашего Пророка Мухаммада.","q":"","f":"Пророк ﷺ сказал: «Кто произнесёт надо мной салават один раз, тому Аллах ниспошлёт десять милостей». В другом предании: «Кто утром десять раз и вечером десять раз произнесёт надо мной салават, того настигнет моё заступничество в День воскресения».","m":"Муслим, 408; ат-Табарани, «аль-Муʼджам аль-аусат», 1662.","s":["Салават — малая часть нашего долга перед Пророком ﷺ; благодаря ему мы обрели это руководство.","Вы шлёте салават ему, а польза возвращается вам — за один салават десять милостей.","Салават никогда не отвергается; потому начинайте и завершайте дуа салаватом.","Умножать салават в пятницу — отдельная сунна."]}}],"timing":[[[0.86,74.82,[0.86,1.22,1.44,2.16,2.44,2.58,2.7,3.76,3.94,6.61,7.57,7.89,8.01,8.59,8.77,9.85,10.05,12.21,13.61,14.27,14.61,14.71,15.17,15.71,16.07,16.47,16.85,17.03,17.19,17.76,18.08,20.7,21.84,21.94,22.2
